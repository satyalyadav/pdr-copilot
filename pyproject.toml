[project]
name = "pdr-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "numpy>=2.2,<3", "opencv-python-headless>=4.11,<5", "pillow>=11,<13", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
